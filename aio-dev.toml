version = 1
[prepare]
inputs = ["package.json", "package-lock.json"]
command = ["npm", "ci"]
output = "node_modules"
[frontend]
inputs = ["frontend", "nuxt.config.ts", "tsconfig.json", "backend", "shared", "scripts", "package.json", "package-lock.json"]
command = ["npm", "run", "build"]
output = "dist/frontend"
[backend]
inputs = ["frontend", "nuxt.config.ts", "tsconfig.json", "backend", "shared", "scripts", "package.json", "package-lock.json"]
command = ["npm", "run", "build"]
output = "dist/server.cjs"
[run]
command = ["node", "{debug_args}", "{artifact}"]
debug_arguments = ["--inspect=127.0.0.1:{debug_port}"]
health = "/health"
